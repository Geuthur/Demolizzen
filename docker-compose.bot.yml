# Runs the Demolizzen bot. Settings come from .env (see .env.example).
#
#   docker compose -f docker-compose.bot.yml up -d --build
#
# Never run two bots with the same token: stop the old one first.
#
# No database yet? The "db" service below is a MariaDB for the bot. It only
# starts when asked for:
#
#   docker compose -f docker-compose.bot.yml --profile database up -d --build
#
# See docs/bot-docker.md.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: demolizzen-bot
    # Also the way the bot waits for the database: it ends while the database
    # is not ready and is started again until it is.
    restart: unless-stopped
    # Passes stop signals on and cleans up after worker processes.
    init: true
    env_file: .env
    environment:
      # The database administrator's password is for the database alone.
      DATABASE_ROOT_PASSWORD: ""
    extra_hosts:
      # Lets the container reach a database on the Docker host itself:
      # DATABASE_HOST=host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      # Logs outlive the container: docker compose -f docker-compose.bot.yml logs
      # shows the console, this volume keeps the log files.
      - bot-logs:/app/demolizzen/logs
    # Time to close the connection to Discord and the database.
    stop_grace_period: 30s

  # Optional database. Its login is the one the bot uses, taken from the same
  # .env: DATABASE_NAME, DATABASE_USER and DATABASE_PASSWORD, plus
  # DATABASE_ROOT_PASSWORD for the administrator. For the bot to find it set
  #   DATABASE_HOST=db
  #   DATABASE_PORT=3306
  # Database, user and passwords are created at the first start only; changing
  # them in .env later does not change an existing database.
  db:
    profiles: ["database"]
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-}
      MARIADB_USER: ${DATABASE_USER:-}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-}
    # Names and messages contain emoji.
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bot-logs:
  db-data:
