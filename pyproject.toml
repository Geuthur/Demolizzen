[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "demolizzen"
description = "Eve Online Discord Bot."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Geuthur", email = "devgeuthur@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "django>=5.2.9,<6",
    "mysqlclient>=2.2.7,<3",
    "oauthlib>=3.3.1,<4",
    "pillow>=12,<13",
    "pre-commit>=4.3,<5",
    "py-cord>=2.7.0rc2,<3",
    "pycolorise>=1,<2",
    "python-dotenv>=1.2.1,<2",
    "python-jose>=3.5,<4",
    "pytz>=2025.2,<2026",
    "requests>=2.32.5,<3",
    "requests-oauthlib>=2,<3",
    "typing-extensions>=4.15,<5",
    "yarl>=1.22,<2",
]
optional-dependencies.tests-demolizzen-latest = [
    "coverage",
]
urls.Changelog = "https://github.com/Geuthur/Demolizzen/blob/master/CHANGELOG.md"
urls.Documentation = "https://github.com/Geuthur/Demolizzen/blob/master/README.md"
urls.Donations = "https://ko-fi.com/Geuthur"
urls.Homepage = "https://github.com/Geuthur/Demolizzen"
urls.Source = "https://github.com/Geuthur/Demolizzen"
urls.Tracker = "https://github.com/Geuthur/Demolizzen/issues"

[tool.hatch.build]
include = [
    "demolizzen/",
]

[tool.hatch.version]
path = "demolizzen/__init__.py"
