<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Demolizzen panel{% endblock %}</title>
<link rel="stylesheet" href="{% url 'stylesheet' %}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{% url 'home' %}">Demolizzen panel</a>
  {% if user %}
  <form class="who" method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <span>{{ user.name }}</span>
    <button class="quiet" type="submit">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
